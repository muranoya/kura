# minio/minio・minio/mc は Docker Hub / quay.io から取得できなくなったため、
# ソースから再ビルドされている Chainguard のイメージを使う。
# minio-client イメージにはシェルが無いので、エイリアスは MC_HOST_* で渡し mc を直接実行する。
services:
  minio:
    image: cgr.dev/chainguard/minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_myminio: http://minioadmin:minioadmin@minio:9000
    command: mb --ignore-existing myminio/kura-test

  seedvault:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_myminio: http://minioadmin:minioadmin@minio:9000
    volumes:
      - ./extension/test-pages/fixtures/vault.json:/tmp/vault.json:ro
    command: cp /tmp/vault.json myminio/kura-test/vault.json
